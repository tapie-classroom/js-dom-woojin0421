<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학교 로맨</title>
  <link rel="stylesheet" href="css/webtoon.css">
</head>
<body>
    <header>
    <div class="logo">
        <img id="webtoonlogo" src="image/logo.png" width ="60" onclick="webtoonlogo()">
        <span id="webtoonlogo" onclick="webtoonlogo()"> 주민 웹 툰</span>
        <a style="color: gray; font-family: 'Noto Sans KR';">웹소설/시리즈</a>
    </div>
</header>
  <div class="container">
    <div class="header">
      <img src="image/sample4.png" class="img" />
      <div class="info">
        <div class="title">학교 로맨</div>
        <div class="author">로맨스 · 15세 이용가</div>
        <div class="desc">
            우리학교 1학년 최고 존잘 이윤규!!!!!

        <div class="tags">
          <span class="tag">#로맨스</span>
          <span class="tag">#학교</span>
          <span class="tag">#윤규</span>
        </div>
        <div class="buttons">
          <button class="btn">+ 관심 99</button>
          <button class="btn secondary">첫화보기 · 1화 짝녀한테 트랄라레오 트랄라라 보내기</button>
        </div>
      </div>
    </div>

    <div class="episode-list">

        <img class="ep-thumbnail" src="https://th.bing.com/th?id=OIF.KhiGuShDl%2bk4K%2fLyjvZA7w&w=148&h=180&c=7&r=0&o=5&dpr=1.8&pid=1.7">

          <div class="ep-title">1화 짝녀한테 트랄라레오 트랄라라 보내기</div>
          <div class="ep-date">⭐ 10.0 · 2025.04.1</div>

      </div>
    </div>
  </div>
  <script src="js/main.js"></script>

</html>
