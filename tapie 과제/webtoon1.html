<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회귀한 만렙 주민</title>
  <link rel="stylesheet" href="css/webtoon.css">
</head>
<body>
    <header>
    <div class="logo">
        <img id="webtoonlogo" src="image/logo.png" width ="60" onclick="webtoonlogo()">
        <span id="webtoonlogo" onclick="webtoonlogo()"> 주민 웹 툰</span>
        <a style="color: gray; font-family: 'Noto Sans KR';">웹소설/시리즈</a>
    </div>
</header>
  <div class="container">
    <div class="header">
      <img src="image/sample1.png" class="img" />
      <div class="info">
        <div class="title">회귀한 만렙주민</div>
        <div class="author">판타지 · 15세 이용가</div>
        <div class="desc">
          주민 마을에 웨이브가 시작되고 몬스터들이 습격하기 시작하는데 이 상황을 전부터 25번째 겪은 주민
          이 사건에서 마을을 지킬 수 있을까?.....
        </div>
        <div class="tags">
          <span class="tag">#판타지</span>
          <span class="tag">#연휴절스페셜컷</span>
          <span class="tag">#우주</span>
        </div>
        <div class="buttons">
          <button class="btn">+ 관심 4,684</button>
          <button class="btn secondary">첫화보기 · 1화 회귀한 주민 프롤로그</button>
        </div>
      </div>
    </div>

    <div class="episode-list">
      <div class="episode">
        <img class="ep-thumbnail" src="image/thumbnail.png">
        <div class="ep-info">
          <div class="ep-title">1화 프롤로그</div>
          <div class="ep-date">⭐ 9.88 · 2025.04.29</div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
